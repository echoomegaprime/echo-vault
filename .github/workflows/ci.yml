name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip==25.1.1
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m pip check
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: python -m pytest
      - name: Real-process CLI end-to-end journey
        run: python scripts/e2e_cli.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned container
        run: docker build --tag echo-vault:${{ github.sha }} .
      - name: Run container journey
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .container-test
          chmod 0777 .container-test
          docker run --rm --user 65532:65532 --entrypoint echo-vault \
            --volume "$PWD/.container-test:/out" \
            echo-vault:${{ github.sha }} init --directory /out/runtime
          secret="$(docker run --rm --entrypoint cat \
            --volume "$PWD/.container-test:/out:ro" \
            echo-vault:${{ github.sha }} /out/runtime/bootstrap-client.secret)"
          docker run --detach --name echo-vault-test --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --volume "$PWD/.container-test/runtime/data:/var/lib/echo-vault" \
            --volume "$PWD/.container-test/runtime/keys.json:/run/secrets/echo_vault_keys:ro" \
            --volume "$PWD/.container-test/runtime/clients.json:/run/secrets/echo_vault_clients:ro" \
            --env ECHO_VAULT_HOST=127.0.0.1 \
            echo-vault:${{ github.sha }}
          trap 'docker rm -fv echo-vault-test >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null
          printf '%s' 'container-synthetic-value' | docker run --rm --interactive --network host \
            --env ECHO_VAULT_CLIENT_ID=local-admin \
            --env ECHO_VAULT_CLIENT_SECRET="$secret" \
            --env ECHO_VAULT_URL=http://127.0.0.1:8080 \
            --entrypoint echo-vault echo-vault:${{ github.sha }} \
            put demo container-check --stdin >/dev/null
          docker run --rm --network host \
            --env ECHO_VAULT_CLIENT_ID=local-admin \
            --env ECHO_VAULT_CLIENT_SECRET="$secret" \
            --env ECHO_VAULT_URL=http://127.0.0.1:8080 \
            --entrypoint echo-vault echo-vault:${{ github.sha }} \
            audit | grep -q '"valid": true'
