name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject secret-bearing artifacts
        shell: bash
        run: |
          set -euo pipefail
          violations="$(git ls-files | grep -Ei '(\.env($|\.)|\.(db|sqlite|sqlite3|pem|key|p12|pfx)$|credential.*export|vault.*export|backup)' | grep -v '^\.env\.example$' || true)"
          if [[ -n "$violations" ]]; then
            echo 'Forbidden secret-bearing artifact is tracked.' >&2
            printf '%s\n' "$violations" >&2
            exit 1
          fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
